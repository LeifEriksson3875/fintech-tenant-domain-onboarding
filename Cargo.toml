[package]
name = "fintech-domain-onboarding"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }

